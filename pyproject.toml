[project]
name = "psswrd"
version = "0.1.0"
description = "Local-first TUI password manager (Textual)"
requires-python = ">=3.10"
dependencies = [
  "prompt-toolkit>=3.0",
  "cryptography>=42",
  "argon2-cffi>=23",
  "pyperclip>=1.8",
]

[project.scripts]
psswrd = "psswrd.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["psswrd*"]
